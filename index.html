<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070f"><title>TechnixPro — Core Engine</title>
<script src="https://tailwindcss.com"></script><link rel="stylesheet" href="https://cloudflare.com">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#05070f;color:#f8fafc;font-family:Arial,sans-serif}
.muted{color:#64748b}
.panel{background:linear-gradient(145deg,#0f172a,#090d16);border:1px solid #1e293b;box-shadow:0 12px 32px #0008;border-radius:24px;transition:all 0.2s ease}
.panel:hover{border-color:#334155}
.screen{animation:fade .3s cubic-bezier(0.4, 0, 0.2, 1)}
.subtab{min-width:33.333%;transition:all 0.2s}
.active-sub{color:#c084fc;border-color:#a855f7;text-shadow:0 0 8px rgba(168,85,247,0.4)}
.nav-btn{color:#475569;min-width:52px;transition:all 0.2s ease-in-out}
.nav-btn.active{color:#c084fc;transform:translateY(-2px);filter:drop-shadow(0 0 8px rgba(168,85,247,0.6))}
.nav-btn span{font-size:10px;margin-top:4px;font-weight:600}
.bottom-nav{padding-bottom:max(16px,env(safe-area-inset-bottom));background:rgba(9,13,22,0.85);backdrop-blur:16px;border-top:1px solid rgba(168,85,247,0.15)}
.scroll-none::-webkit-scrollbar{display:none}.scroll-none{scrollbar-width:none}
.processor{position:relative;overflow:hidden;background:radial-gradient(circle at center,#0e7490 0,#0f172a 45%,#05070f 85%);border:1px solid rgba(6,182,212,0.3)}
.processor:before,.processor:after{content:"";position:absolute;border-radius:50%;inset:12%;border:1px solid rgba(6,182,212,0.2);animation:spin 10s linear infinite}
.processor:after{inset:3%;border-color:rgba(168,85,247,0.2);animation-direction:reverse;animation-duration:14s}
.chip{z-index:2;animation:pulse 2.5s ease-in-out infinite;box-shadow:0 0 30px #06b6d4,0 0 60px rgba(168,85,247,0.4)}
.dot{animation:blink 1.8s infinite}.dot:nth-child(2){animation-delay:.4s}.dot:nth-child(3){animation-delay:.8s}
.reward-art{background:radial-gradient(circle at 70% 20%,rgba(6,182,212,0.3),transparent 35%),linear-gradient(135deg,#3b0764,#090d16 65%,#164e63);position:relative;overflow:hidden}
.reward-art:after{content:'$';position:absolute;right:18px;bottom:-30px;color:rgba(255,255,255,0.03);font-size:160px;font-weight:900;transform:rotate(-12deg)}
.progress{background:#1e293b;border-radius:99px;height:10px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,0.5)}
.progress>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#a855f7,#06b6d4);transition:width .5s ease-out;box-shadow:0 0 10px #a855f7}
.status{font-size:11px;font-weight:700;border:1px solid #334155;border-radius:999px;padding:4px 10px;background:rgba(15,23,42,0.6)}
.done{color:#34d399;border-color:rgba(52,211,153,0.3);background:rgba(52,211,153,0.05)}
.tab-scroll{overflow-x:auto;white-space:nowrap}.tab-scroll button{display:inline-block;min-width:92px}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg) scale(1.02)}}
@keyframes pulse{50%{transform:scale(1.05);filter:brightness(1.15)}}
@keyframes blink{50%{opacity:.1;transform:scale(0.8)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="max-w-2xl mx-auto min-h-screen pb-[calc(5.5rem+env(safe-area-inset-bottom))]">
<header class="sticky top-0 z-30 flex items-center justify-between px-4 py-3 bg-[#05070f]/90 backdrop-blur-xl border-b border-slate-800/60"><div class="flex items-center gap-3"><button onclick="show('profile','Profil')" class="w-10 h-10 rounded-2xl bg-gradient-to-br from-purple-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-purple-500/20"><i class="fa-solid fa-user text-white"></i></button><div><p class="text-[10px] font-bold uppercase tracking-[.25em] text-cyan-400">TechnixPro</p><h1 id="title" class="text-base font-black tracking-wide">Sieć społeczna</h1></div></div><div class="flex gap-4 text-lg text-slate-400"><button onclick="show('search','Wyszukiwarka')"><i class="fa-solid fa-magnifying-glass"></i></button><button onclick="show('notifications','Powiadomienia')"><i class="fa-regular fa-bell"></i></button></div></header>
<div id="home-tabs" class="flex sticky top-[65px] z-20 bg-[#05070f] border-b border-slate-800/60"><button class="subtab active-sub py-3 border-b-2 text-sm font-bold" onclick="sub('home','channel',this)">Kanał</button><button class="subtab py-3 border-b-2 border-transparent muted text-sm font-bold" onclick="sub('home','group',this)">Grupa</button><button class="subtab py-3 border-b-2 border-transparent muted text-sm font-bold" onclick="sub('home','info',this)">Info</button></div>
<div id="gift-tabs" class="hidden tab-scroll sticky top-[65px] z-20 bg-[#05070f] border-b border-slate-800/60"><button class="active-sub py-3 border-b-2 text-sm font-bold px-4" onclick="rewardTab('overview',this)">Overview</button><button class="py-3 border-b-2 border-transparent muted text-sm font-bold px-4" onclick="rewardTab('events',this)">Live Events</button><button class="py-3 border-b-2 border-transparent muted text-sm font-bold px-4" onclick="rewardTab('tasks',this)">Tasks</button><button class="py-3 border-b-2 border-transparent muted text-sm font-bold px-4" onclick="rewardTab('frens',this)">Frens 👥</button><button class="py-3 border-b-2 border-transparent muted text-sm font-bold px-4" onclick="rewardTab('rewards',this)">Rewards</button><button class="py-3 border-b-2 border-transparent muted text-sm font-bold px-4" onclick="rewardTab('leaderboard',this)">Ranking</button><button class="py-3 border-b-2 border-transparent muted text-sm font-bold px-4" onclick="rewardTab('history',this)">Historia</button></div>
<div id="content" class="p-4 scroll-none">
